[build]
  command = "flutter build web --release --dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  # These values should be provided in Netlify site settings or via GitHub Actions secrets.
  # Since we deploy a prebuilt site from GitHub Actions, Netlify's build step is skipped during CI.
  # Use these environment variables if you also want Netlify to build the site from the UI or webhooks.
  SUPABASE_URL = "${SUPABASE_URL}"
  SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
